name: Cross-platform release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Reviewed tag build run ID (leave both inputs blank to build)'
        type: string
      manifest_sha256:
        description: 'SHA-256 of SHA256SUMS from the reviewed download'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Check release integrity gates
        run: |
          python3 -m unittest discover -s packaging/tests -p 'test_prepare_release.py' -v
          python3 -m unittest discover -s packaging -p 'test_publish_release.py' -v
      - name: Validate version and release channel
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, xml.etree.ElementTree as ET
          header = pathlib.Path('src/okjversion.h').read_text()
          version = re.search(r'OKJ_VERSION_STRING "([^"\n]+)"', header)[1]
          parts = [re.search(r'OKJ_VERSION_' + part + r' (\d+)', header)[1]
                   for part in ('MAJOR', 'MINOR', 'BUILD')]
          channel = re.search(r'OKJ_VERSION_BRANCH "([^"\n]+)"', header)[1]
          if '.'.join(parts) != version or channel not in ('stable', 'prerelease', 'beta'):
              raise SystemExit('Source version/release channel metadata disagree')
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              match = re.fullmatch(r'v(\d+\.\d+\.\d+)(?:-(prerelease|preview|beta)\.\d+)?', tag)
              if not match or match[1] != version:
                  raise SystemExit('Expected v' + version + ' or a matching prerelease tag')
              expected_channel = {'beta': 'beta', None: 'stable'}.get(match[2], 'prerelease')
              if channel != expected_channel:
                  raise SystemExit('Release tag and source channel do not match')
          else:
              tag = 'v' + version + ('' if channel == 'stable' else f'-{channel}.1')
          for name in ('RELEASE_NOTES.md', 'WINDOWS_RELEASE_NOTES.md'):
              heading = pathlib.Path('packaging', name).read_text().splitlines()[0]
              if heading.split()[:3] != ['#', 'OpenKJ', version]:
                  raise SystemExit('Update ' + name)
          release = ET.parse('src/org.openkj.OpenKJ.metainfo.xml').find('./releases/release')
          expected_type = 'stable' if channel == 'stable' else 'development'
          if release is None or release.get('version') != version or release.get('type') != expected_type:
              raise SystemExit('Update Linux AppStream release metadata')
          run_id = os.environ['CANDIDATE_RUN_ID']
          checksum = os.environ['MANIFEST_SHA256']
          promote = bool(run_id or checksum)
          if promote and (not ref.startswith('refs/tags/') or not re.fullmatch(r'[1-9][0-9]*', run_id)
                          or not re.fullmatch(r'[0-9a-f]{64}', checksum)):
              raise SystemExit('Select the release tag and supply both the candidate run ID and the manifest SHA-256')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('tag=' + tag, file=out)
              print('commit=' + commit, file=out)
              print('publish=' + str(promote).lower(), file=out)
          PY

  macos:
    name: macOS Build
    needs: validate
    if: needs.validate.outputs.publish == 'false'
    uses: ./.github/workflows/macos-build.yml
    permissions:
      contents: write

  windows:
    name: Windows Build
    needs: validate
    if: needs.validate.outputs.publish == 'false'
    uses: ./.github/workflows/windows-test.yml
    permissions:
      contents: write

  linux:
    name: Linux Build
    needs: validate
    if: needs.validate.outputs.publish == 'false'
    uses: ./.github/workflows/linux-test.yml

  candidate:
    needs: [validate, macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: OpenKJ-macos-arm64
          path: downloads/macos
      - uses: actions/download-artifact@v7
        with:
          name: OpenKJ-Windows-x64-portable
          path: downloads/windows-zip
      - uses: actions/download-artifact@v7
        with:
          name: OpenKJ-Windows-x64-msi
          path: downloads/windows-msi
      - uses: actions/download-artifact@v7
        with:
          name: OpenKJ-Linux-x86_64-flatpak
          path: downloads/linux
      - uses: actions/download-artifact@v7
        with:
          name: OpenKJ-Fedora44-x86_64-portable
          path: downloads/linux-portable
      - name: Verify checksums, versions, and source provenance
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 packaging/prepare_release.py --artifacts downloads --output release --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Upload staged release for review
        uses: actions/upload-artifact@v6
        with:
          name: OpenKJ-release-candidate
          path: release/
          if-no-files-found: error
      - name: Record candidate details
        run: |
          {
            echo "Candidate run ID: $GITHUB_RUN_ID"
            echo
            echo 'SHA-256 of SHA256SUMS:'
            echo
            sha256sum release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" --arg commit "$RELEASE_COMMIT" \
            '.path == ".github/workflows/release.yml" and
             .head_repository.full_name == $repo and .head_sha == $commit and
             .event == "push" and .conclusion == "success"'
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: OpenKJ-release-candidate
          path: release
      - name: Publish reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 packaging/publish_release.py release --repo "$GH_REPO" --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" --run-id "$CANDIDATE_RUN_ID" --manifest-sha256 "$MANIFEST_SHA256"
